name: Incremental quality

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Run incremental Stryker mutation'
        required: false
        default: 'false'

jobs:
  backend-incremental:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Incremental tests + patch coverage
        env:
          BASE_REF: origin/${{ github.base_ref || 'develop' }}
          PATCH_COVERAGE_LINES: '85'
        run: node scripts/dev/incremental-quality.mjs

      - name: Incremental mutation (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.mutation == 'true'
        env:
          BASE_REF: origin/${{ github.base_ref || 'develop' }}
        run: node scripts/dev/incremental-quality.mjs --mutation
