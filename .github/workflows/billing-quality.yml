name: Billing quality

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'domain/billing/**'
      - 'api/billing/**'
      - 'tests/unit/billing/**'
      - 'stryker.config.js'
      - 'vitest.config.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  billing-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Billing unit tests + coverage
        run: npm run test:billing:coverage

      - name: Billing mutation testing
        run: npm run test:billing:mutation
